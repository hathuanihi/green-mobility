version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS Extension
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: greenmobility-postgres
    restart: always
    environment:
      POSTGRES_DB: greenmobility_db
      POSTGRES_USER: green_admin
      POSTGRES_PASSWORD: green_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - green-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U green_admin -d greenmobility_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7.2 (Geospatial & Distributed Cache & Redisson Locks)
  redis:
    image: redis:7.2-alpine
    container_name: greenmobility-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - green-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MongoDB 7.0 (High-Density GPS Telemetry Logs & Audit Trails)
  mongodb:
    image: mongo:7.0
    container_name: greenmobility-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password_2026
      MONGO_INITDB_DATABASE: greenmobility_telemetry
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - green-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. RabbitMQ 3.13 with Management Web UI
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: greenmobility-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_admin
      RABBITMQ_DEFAULT_PASS: rabbit_password_2026
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web Dashboard
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks:
      - green-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. MinIO (S3-compatible Object Storage for Local KYC/Image uploads)
  minio:
    image: minio/minio:latest
    container_name: greenmobility-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2026
    ports:
      - "9000:9000"     # S3 API endpoint
      - "9001:9001"     # MinIO Web Console
    volumes:
      - miniodata:/data
    networks:
      - green-network

networks:
  green-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  mongodata:
  rabbitdata:
  miniodata:
