server:
  port: ${PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/api/v1}

spring:
  application:
    name: green-mobility-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 60MB

  # PostgreSQL + PostGIS DataSource
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:greenmobility_db}
    username: ${DB_USER:green_admin}
    password: ${DB_PASSWORD:green_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  # JPA & Hibernate Spatial
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  # Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

    # MongoDB Telemetry Configuration
    mongodb:
      uri: ${MONGO_URI:mongodb://${DB_USER:mongo_admin}:${DB_PASSWORD:mongo_password_2026}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:greenmobility_telemetry}?authSource=admin}

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rabbit_admin}
    password: ${RABBITMQ_PASSWORD:rabbit_password_2026}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1

# Security & JWT Properties
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# Springdoc OpenAPI (Swagger UI) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Green Mobility Business Properties
green-mobility:
  matching:
    tier1-radius-km: 1.5
    tier2-radius-km: 3.0
    tier3-radius-km: 5.0
    driver-response-timeout-seconds: 15
  carbon:
    default-grid-emission-factor-gco2-kwh: 722.1
    tree-absorption-daily-kg: 0.06
    led-bulb-consumption-hourly-gco2: 7.221
